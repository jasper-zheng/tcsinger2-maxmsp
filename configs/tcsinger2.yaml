model:
  base_learning_rate: 5.0e-05  # absolute: scripts/train_tcsinger2.sh passes --scale_lr false (the paper's rate)
  target: ldm.models.diffusion.cfm1_audio.CFM
  params:
    linear_start: 0.00085
    linear_end: 0.012
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: image
    cond_stage_key: caption
    mel_dim: 20
    channels: 0
    cond_stage_trainable: True
    conditioning_key: hybrid
    monitor: val/loss_simple_ema
    scale_by_std: true
    use_ema: true  # samples and evaluation use the EMA weights (the released config has no EMA)
    scheduler_config:
      target: ldm.lr_scheduler.LambdaLinearScheduler
      params:
        warm_up_steps:
        - 10000
        cycle_lengths:
        - 10000000000000
        f_start:
        - 1.0e-06
        f_max:
        - 1.0
        f_min:
        - 1.0
    unet_config:
      target: ldm.modules.diffusionmodules.tcsinger2.TCSinger2
      params:
        in_channels: 20
        ori_dim: 1024
        context_dim: 768
        hidden_size: 768
        num_heads: 8
        depth: 4
        max_len: 3760
        num_experts: 4

    first_stage_config:
      target: ldm.models.autoencoder1d.AutoencoderKL
      params:
        embed_dim: 20
        monitor: val/rec_loss
        ckpt_path: useful_ckpts/vae_gtsinger.ckpt  # WP4: batch 70,000 of logs/2026-10-09T00-11-41_ae_singing (scripts/export_vae.py)
        ddconfig:
          double_z: true
          in_channels: 80
          out_ch: 80
          z_channels: 20
          kernel_size: 5
          ch: 384
          ch_mult:
          - 1
          - 2
          - 4
          num_res_blocks: 2
          attn_layers:
          - 2
          down_layers:
          - 0
          - 1
          # - 2
          dropout: 0.0
          hidden_size: 256
          dur_predictor_kernel: 3
          dur_predictor_layers: 2
          predictor_dropout: 0.5
          enc_layers: 4
          enc_ffn_kernel_size: 9
          enc_prenet: true
          enc_pre_ln: true
          num_heads: 2
        lossconfig:
          target: torch.nn.Identity
    cond_stage_config:
      target: ldm.modules.encoders.modules.FrozenTextVocalEmbedder
      params:
        version: useful_ckpts/flan-t5-large
        max_length: 80

lightning:
  logger:
    params:
      version: 0  # every session of a run appends to the same TensorBoard directory
  modelcheckpoint:  # rolling checkpoints to resume from: every 1,000 steps, newest two kept
    params:
      filename: '{step:08d}'
      monitor: step
      mode: max
      save_top_k: 2
      every_n_train_steps: 1000
      save_last: false
  callbacks:
    progress_bar:  # one progress line per 200 steps in the log file
      target: pytorch_lightning.callbacks.TQDMProgressBar
      params:
        refresh_rate: 200
    metrics_over_trainsteps_checkpoint:  # milestones, weights only, all kept
      params:
        every_n_train_steps: 10000
    image_logger:  # 8 fixed validation clips, from notes alone and with their F0 given (ldm/stage2_samples.py)
      target: ldm.stage2_samples.Stage2SampleLogger
      params:
        batch_frequency: 5000
        max_images: 8
        cfg_scale: 3.0
        steps: 25
  trainer:
    benchmark: false  # batches differ in length, cudnn autotuning would rerun for every new shape
    gradient_clip_val: 1.0
    precision: bf16  # mixed precision for the transformer (1.6x faster); the VAE and T5 stay in full precision
    replace_sampler_ddp: false
    reload_dataloaders_every_n_epochs: 1  # the extra corpora contribute another subset each epoch
    max_steps: 200000

data:
  target: main.SpectrogramDataModuleFromConfig
  params:
    batch_size: 8  # only used when max_tokens is not set
    num_workers: 8
    main_spec_dir_path: 'data/sing,data/sing_ext'  # GTSinger + M4Singer, Opencpop, OpenSinger (WP9)
    other_spec_dir_path: ''
    mel_num: 80
    drop: 0.2
    spec_crop_len: 3760
    max_tokens: 48000      # frame budget of a batch: clips x (longest clip + max_prompt_len)
    max_batch_clips: 64
    max_prompt_len: 1500   # prompts are cut to 8 s
    ext_share: 0.4         # share of an epoch's frames from the extra corpora (all Chinese)
    train:
      target: ldm.data.tcsinger2_dataset.JoinSpecsTrain
      params:
        specs_dataset_cfg:
    validation:
      target: ldm.data.tcsinger2_dataset.JoinSpecsValidation
      params:
        specs_dataset_cfg:

test_dataset:
  target: ldm.data.tsvdataset.TSVDatasetStruct
  params:
    tsv_path: audiocaps_test_16000_struct2.tsv
    spec_crop_len: 3760
