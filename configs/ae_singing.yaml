model:
  base_learning_rate: 4.5e-06
  target: ldm.models.autoencoder1d.AutoencoderKL
  params:
    embed_dim: 20
    monitor: val/rec_loss
    ddconfig:
      double_z: true
      in_channels: 80
      out_ch: 80
      z_channels: 20
      kernel_size: 5
      ch: 384
      ch_mult:
      - 1
      - 2
      - 4
      num_res_blocks: 2
      attn_layers:
      - 2
      down_layers:
      - 0
      - 1
      # - 2
      dropout: 0.0
      hidden_size: 256
      dur_predictor_kernel: 3
      dur_predictor_layers: 2
      predictor_dropout: 0.5
      enc_layers: 4
      enc_ffn_kernel_size: 9
      enc_prenet: true
      enc_pre_ln: true
      num_heads: 2
    lossconfig:
      target: ldm.modules.losses_audio.contperceptual.LPAPSWithDiscriminator
      params:
        disc_start: 80001  # in global steps = 2 x batches (one step per optimizer): batch 40,000
        perceptual_weight: 0.0
        kl_weight: 1.0e-06
        disc_weight: 0.5
        disc_in_channels: 1
        disc_loss: mse
        disc_factor: 2
        disc_conditional: false
        r1_reg_weight: 3

lightning:
  logger:
    params:
      version: 0  # every session of a run appends to the same TensorBoard directory
  modelcheckpoint:  # rolling checkpoints to resume from: every 1,000 batches, newest two kept
    params:
      filename: '{step:08d}'
      monitor: step
      mode: max
      save_top_k: 2
      every_n_train_steps: 2000
      save_last: false
  callbacks:
    progress_bar:  # one progress line per 200 batches in the log file
      target: pytorch_lightning.callbacks.TQDMProgressBar
      params:
        refresh_rate: 200
    metrics_over_trainsteps_checkpoint:  # milestones, weights only, all kept: every 10,000 batches
      params:
        every_n_train_steps: 20000
    image_logger:
      target: main.AudioLogger
      params:
        for_specs: true
        increase_log_steps: false
        batch_frequency: 5000
        max_images: 4
        rescale: false
        melvmin: -5
        melvmax: 1.5
        sample_rate: 48000
        vocoder_cfg:
          target: vocoder.hifigan.hifigan_nsf.HifiGAN_NSF
          params:
            vocoder_ckpt: useful_ckpts/hifigan
            use_nsf: true
  trainer:
    sync_batchnorm: false # not working with r1_regularization
    strategy: ddp
    benchmark: true
    max_steps: 140000  # 70,000 batches


data:
  target: main.SpectrogramDataModuleFromConfig
  params:
    batch_size: 16
    num_workers: 8
    spec_dir_path: data/sing
    mel_num: 80
    spec_len: 2000
    spec_crop_len: 2000
    train:
      target: ldm.data.joinaudiodataset_ae.JoinSpecsTrain
      params:
        specs_dataset_cfg: null
    validation:
      target: ldm.data.joinaudiodataset_ae.JoinSpecsValidation
      params:
        specs_dataset_cfg: null
