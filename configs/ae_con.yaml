# Custom Audio Encoder (WP5): speech encoder and content branch, trained with a contrastive loss on top of
# the frozen VAE of ae_singing.yaml. One optimizer, so a step is a batch here.
model:
  base_learning_rate: 7.8125e-07  # read by main.py only; the model uses params.lr
  target: ldm.models.autoencoder1d_con.AutoencoderKL
  params:
    embed_dim: 20
    monitor: val/loss_contrastive
    ckpt_path: useful_ckpts/vae_gtsinger.ckpt  # the trained VAE (WP4); it stays frozen
    contrastive_temp: 0.07
    lr: 5.0e-05
    warmup_steps: 1000
    ddconfig:
      double_z: true
      in_channels: 80
      out_ch: 80
      z_channels: 20
      kernel_size: 5
      ch: 384
      ch_mult:
      - 1
      - 2
      - 4
      num_res_blocks: 2
      attn_layers:
      - 2
      down_layers:
      - 0
      - 1
      # - 2
      dropout: 0.0
      hidden_size: 256
      dur_predictor_kernel: 3
      dur_predictor_layers: 2
      predictor_dropout: 0.5
      enc_layers: 4
      enc_ffn_kernel_size: 9
      enc_prenet: true
      enc_pre_ln: true
      num_heads: 2
    lossconfig:
      target: torch.nn.Identity  # no reconstruction or adversarial loss in this stage

lightning:
  logger:
    params:
      version: 0  # every session of a run appends to the same TensorBoard directory
  modelcheckpoint:  # rolling checkpoints to resume from: every 250 batches, newest two kept
    params:
      filename: '{step:08d}'
      monitor: step
      mode: max
      save_top_k: 2
      every_n_train_steps: 250
      save_last: false
  callbacks:
    progress_bar:  # one progress line per 100 batches in the log file
      target: pytorch_lightning.callbacks.TQDMProgressBar
      params:
        refresh_rate: 100
    metrics_over_trainsteps_checkpoint:  # milestones, weights only, all kept: every 1,000 batches
      params:
        every_n_train_steps: 1000
  trainer:
    strategy: ddp
    benchmark: false  # no faster here, and its trial runs take 39 GB at batch 32
    max_steps: 10000  # 397 batches per epoch, so about 25 epochs


data:
  target: main.SpectrogramDataModuleFromConfig
  params:
    batch_size: 64
    num_workers: 8
    spec_dir_path: data/con
    mel_num: 80
    spec_crop_len: 1000  # frames of singing per clip (5.3 s)
    train:
      target: ldm.data.joinaudiodataset_con.JoinSpecsTrain
      params:
        specs_dataset_cfg: null
        speech_crop_len: 750  # frames of speech per clip (4 s)
        num_neg: 2
    validation:
      target: ldm.data.joinaudiodataset_con.JoinSpecsValidation
      params:
        specs_dataset_cfg: null
        speech_crop_len: 750
        num_neg: 2
